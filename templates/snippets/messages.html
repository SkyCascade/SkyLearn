{% if messages %}
<div class="space-y-3">
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div class="flex items-center p-4 rounded-lg border border-red-200 bg-red-50 text-red-800 shadow-sm transition-all duration-300 transform hover:scale-[1.02]">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-circle text-red-500 text-lg w-5"></i>
                </div>
                <div class="ml-3 flex-1">
                    <p class="text-sm font-medium">{{ message }}</p>
                </div>
                <button type="button" class="flex-shrink-0 ml-auto -mx-1.5 -my-1.5 bg-red-50 text-red-500 rounded-lg focus:ring-2 focus:ring-red-400 p-1.5 hover:bg-red-200 inline-flex items-center justify-center h-8 w-8 transition-colors duration-200" onclick="this.parentElement.remove()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
        {% elif message.tags == 'warning' %}
            <div class="flex items-center p-4 rounded-lg border border-amber-200 bg-amber-50 text-amber-800 shadow-sm transition-all duration-300 transform hover:scale-[1.02]">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-triangle text-amber-500 text-lg w-5"></i>
                </div>
                <div class="ml-3 flex-1">
                    <p class="text-sm font-medium">{{ message }}</p>
                </div>
                <button type="button" class="flex-shrink-0 ml-auto -mx-1.5 -my-1.5 bg-amber-50 text-amber-500 rounded-lg focus:ring-2 focus:ring-amber-400 p-1.5 hover:bg-amber-200 inline-flex items-center justify-center h-8 w-8 transition-colors duration-200" onclick="this.parentElement.remove()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
        {% elif message.tags == 'info' %}
            <div class="flex items-center p-4 rounded-lg border border-blue-200 bg-blue-50 text-blue-800 shadow-sm transition-all duration-300 transform hover:scale-[1.02]">
                <div class="flex-shrink-0">
                    <i class="fas fa-info-circle text-blue-500 text-lg w-5"></i>
                </div>
                <div class="ml-3 flex-1">
                    <p class="text-sm font-medium">{{ message }}</p>
                </div>
                <button type="button" class="flex-shrink-0 ml-auto -mx-1.5 -my-1.5 bg-blue-50 text-blue-500 rounded-lg focus:ring-2 focus:ring-blue-400 p-1.5 hover:bg-blue-200 inline-flex items-center justify-center h-8 w-8 transition-colors duration-200" onclick="this.parentElement.remove()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
        {% else %}
            <div class="flex items-center p-4 rounded-lg border border-green-200 bg-green-50 text-green-800 shadow-sm transition-all duration-300 transform hover:scale-[1.02]">
                <div class="flex-shrink-0">
                    <i class="fas fa-check-circle text-green-500 text-lg w-5"></i>
                </div>
                <div class="ml-3 flex-1">
                    <p class="text-sm font-medium">{{ message }}</p>
                </div>
                <button type="button" class="flex-shrink-0 ml-auto -mx-1.5 -my-1.5 bg-green-50 text-green-500 rounded-lg focus:ring-2 focus:ring-green-400 p-1.5 hover:bg-green-200 inline-flex items-center justify-center h-8 w-8 transition-colors duration-200" onclick="this.parentElement.remove()">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>
        {% endif %}
    {% endfor %}
</div>

<script>
    // Auto-dismiss messages after 5 seconds
    document.addEventListener('DOMContentLoaded', function() {
        const alerts = document.querySelectorAll('[class*="bg-"]');
        alerts.forEach(alert => {
            setTimeout(() => {
                if (alert.parentElement) {
                    alert.style.opacity = '0';
                    alert.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        if (alert.parentElement) {
                            alert.remove();
                        }
                    }, 300);
                }
            }, 5000);
        });
    });
</script>
{% endif %}
