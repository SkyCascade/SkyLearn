{% load static tailwind_tags i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Salymbekov University{% endblock %}</title>

    <!-- Tailwind CSS сначала -->
    {% tailwind_css %}

    <!-- Bootstrap после Tailwind -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-5.3.2/css/bootstrap.min.css' %}">
    
    <!-- Дополнительные стили -->
    <link rel="stylesheet" href="{% static 'vendor/fontawesome-6.5.1/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.min.css' %}">

    <style>
        /* Сброс конфликтующих стилей */
        .bg-gray-50 {
            background-color: #f9fafb !important;
        }
        
        /* Убедимся, что Bootstrap не переопределяет наши цвета */
        body {
            background-color: #f9fafb !important;
        }
        
        /* Дополнительные кастомные стили для предотвращения конфликтов */
        .container-fluid {
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        
        /* Улучшенное позиционирование контента относительно фиксированного хедера */
        #main-content {
            padding: 0; /* Убираем все отступы, они будут управляться в дочерних компонентах */
        }
        
        /* Переопределяем стили из style.min.css для лучшего контроля отступов */
        #main {
            padding-top: 0 !important; /* Убираем верхний отступ из основного CSS */
        }
    </style>
</head>
<body class="bg-gray-50">

    {% block sidebar %}{% include 'sidebar.html' %}{% endblock %}

    <div id="main" class="min-h-screen">
        {% block topbar %}{% include 'navbar.html' %}{% endblock %}

        <div class="container-fluid" id="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{% static 'vendor/jquery-3.7.1/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap-5.3.2/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

    {% block js %}{% endblock %}
</body>
</html>
